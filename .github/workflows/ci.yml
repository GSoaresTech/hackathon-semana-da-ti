name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      # Banco usado pelos testes do server (mesma porta/credenciais do .env.test).
      database_test:
        image: postgres:16
        ports:
          - 5441:5432
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: triar_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A env do web é validada no next.config.ts, então o build precisa destes valores.
      # São de teste. Os testes do server leem o próprio .env.test e não chamam a OpenAI —
      # o CI não precisa de OPENAI_API_KEY.
      NEXT_PUBLIC_API_URL: '/api'
      PRIVATE_API_URL: 'http://localhost:4000/api'
      SESSION_SECRET: 'ci-secret-com-mais-de-16-caracteres'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (Biome)
        run: npm run ci:lint

      # Em passos separados: rodando juntos, o `next typegen` (typecheck) e o
      # `next build` escrevem ao mesmo tempo em apps/web/.next e o typegen
      # falha de forma intermitente (ENOENT em .next/types/routes.d.ts).
      - name: Checagem de tipos
        run: npx turbo run typecheck

      - name: Build
        run: npx turbo run build

      - name: Testes do server
        run: npm test
